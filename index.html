<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>부산외대 고급 최종발표</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: 상단 고정 탭바(발표 순서) + 조별 화면은 왼쪽 포스터 / 오른쪽 요약·개념·질문·메모 2단, 좁으면 1단 */
:root{
  --bg:#f5f6fa; --surface:#ffffff; --sunk:#eceef5; --fg:#151a2e; --muted:#5a6079; --line:#d9dcea;
  --navy:#1d2a6b; --navy-soft:#e3e7f7; --gold:#e8b100; --gold-soft:#fff3c4; --gold-fg:#6b5000;
  --good:#16784a; --good-soft:#dcf2e6; --warn:#a2560a; --warn-soft:#fbe9d4; --bad:#c22a2a; --bad-soft:#fbe0e0;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-num:"Space Grotesk","IBM Plex Sans KR",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1220; --surface:#171b2e; --sunk:#1f2440; --fg:#e8eaf4; --muted:#9aa1bd; --line:#2c3252;
  --navy:#9fb0ff; --navy-soft:#252d57; --gold:#f2c534; --gold-soft:#3b3214; --gold-fg:#f6d877;
  --good:#5fd39a; --good-soft:#163527; --warn:#f0a35a; --warn-soft:#3a2614; --bad:#ff7a7a; --bad-soft:#401a1d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1220; --surface:#171b2e; --sunk:#1f2440; --fg:#e8eaf4; --muted:#9aa1bd; --line:#2c3252;
  --navy:#9fb0ff; --navy-soft:#252d57; --gold:#f2c534; --gold-soft:#3b3214; --gold-fg:#f6d877;
  --good:#5fd39a; --good-soft:#163527; --warn:#f0a35a; --warn-soft:#3a2614; --bad:#ff7a7a; --bad-soft:#401a1d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-block:12px 6px}
.brand h1{font-size:18px;margin:0;letter-spacing:-.01em}
.brand .meta{color:var(--muted);font-size:13px}
.brand .now{margin-left:auto;font-family:var(--font-num);font-size:13px;color:var(--gold-fg);background:var(--gold-soft);padding:2px 10px;border-radius:99px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:4px 10px;scrollbar-width:thin}
nav.tabs a{flex:none;text-decoration:none;color:var(--muted);font-size:14px;padding:6px 12px;border-radius:8px;border:1px solid transparent;white-space:nowrap}
nav.tabs a:hover{background:var(--sunk);color:var(--fg)}
nav.tabs a.on{background:var(--navy);color:var(--surface);font-weight:600}
nav.tabs a .ord{font-family:var(--font-num);font-size:11px;opacity:.7;margin-right:4px}
nav.tabs .sep{flex:none;width:1px;background:var(--line);margin:4px 4px}
nav.tabs a.live{border-color:var(--gold)}
main{padding-block:20px 60px}
section.view{display:grid;gap:20px}
h2{font-size:22px;margin:0;text-wrap:balance;letter-spacing:-.01em}
h3{font-size:16px;margin:0 0 10px;color:var(--navy)}
.lead{color:var(--muted);margin:4px 0 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:900px){.grid2,.grid3{grid-template-columns:1fr}}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--navy-soft);color:var(--navy);font-weight:600;white-space:nowrap}
.chip.gold{background:var(--gold-soft);color:var(--gold-fg)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.tw{overflow-x:auto}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
ul.plain{margin:0;padding-left:18px}
ul.plain li{margin:3px 0}
/* timeline */
.tl{display:grid;gap:6px}
.tl-row{display:grid;grid-template-columns:110px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:inherit}
.tl-row.break{background:transparent;border-style:dashed;color:var(--muted)}
.tl-row.live{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft)}
.tl-row.done{opacity:.55}
.tl-row .t{font-family:var(--font-num);font-size:13px;color:var(--muted)}
.tl-row .who{font-weight:600}
.tl-row .topic{font-size:13px;color:var(--muted)}
@media (max-width:600px){.tl-row{grid-template-columns:1fr}.tl-row .t{order:-1}}
/* team */
.team-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.team-head .slot{font-family:var(--font-num);color:var(--muted);font-size:14px}
.team-layout{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:960px){.team-layout{grid-template-columns:1fr}}
.poster{position:sticky;top:112px}
@media (max-width:960px){.poster{position:static}}
.poster img{display:block;width:100%;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:zoom-in}
.poster .cap{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.poster .cap a{color:var(--navy)}
.stack{display:grid;gap:16px;min-width:0}
.kv{display:grid;grid-template-columns:88px 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{background:var(--sunk);border-radius:8px;padding:8px 12px;min-width:120px;flex:1 1 140px}
.stat b{display:block;font-family:var(--font-num);font-size:20px;color:var(--navy);line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
.concepts{display:grid;gap:8px}
.concept{border-left:3px solid var(--gold);padding:4px 0 4px 12px}
.concept b{display:block}
.concept p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.concept .here{font-size:13px;color:var(--fg);margin-top:4px}
.fit{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:600px){.fit{grid-template-columns:1fr}}
.fit div{border-radius:8px;padding:10px 12px;font-size:14px}
.fit .s{background:var(--good-soft)} .fit .w{background:var(--warn-soft)}
.fit h4{margin:0 0 4px;font-size:13px}
.fit .s h4{color:var(--good)} .fit .w h4{color:var(--warn)}
details.q{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface)}
details.q+details.q{margin-top:8px}
details.q summary{cursor:pointer;font-weight:600;list-style:none;display:flex;gap:8px}
details.q summary::-webkit-details-marker{display:none}
details.q summary .qn{font-family:var(--font-num);color:var(--gold-fg);flex:none}
details.q .why{font-size:12px;color:var(--muted);margin:6px 0 0}
details.q .ans{margin:8px 0 0;font-size:14px;background:var(--sunk);border-radius:6px;padding:8px 10px}
details.q .ans b{color:var(--good)}
.notes{font-size:14px;color:var(--muted)}
.notes li{margin:3px 0}
/* memo */
.memo textarea{width:100%;min-height:180px;resize:vertical;font:inherit;font-size:15px;line-height:1.6;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.memo textarea:focus{outline:2px solid var(--navy);outline-offset:1px}
.memo .bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.memo .st{font-size:12px;color:var(--muted)}
.memo .quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.memo .quick button{font:inherit;font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.memo .quick button:hover{border-color:var(--navy)}
button.btn{font:inherit;font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid var(--navy);background:var(--navy);color:var(--surface);cursor:pointer}
button.btn.ghost{background:transparent;color:var(--navy)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.crit td:nth-child(2){font-family:var(--font-num);font-weight:700;color:var(--navy);width:56px}
.bar-w{height:6px;border-radius:3px;background:var(--navy);opacity:.75}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.gl .panel h4{margin:0 0 4px;font-size:15px}
.gl .panel p{margin:0;font-size:14px;color:var(--muted)}
.gl .panel .teams{margin-top:6px;display:flex;gap:4px;flex-wrap:wrap}
.allmemo .item{border-top:1px solid var(--line);padding:10px 0}
.allmemo .item h4{margin:0 0 4px;font-size:14px}
.allmemo pre{white-space:pre-wrap;margin:0;font:inherit;font-size:14px}
.lightbox{position:fixed;inset:0;z-index:20;background:rgba(10,12,24,.85);overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.lightbox img{display:block;max-width:none;width:min(1400px,100%);margin:0 auto;cursor:zoom-out;background:#fff}
@media (prefers-reduced-motion:no-preference){nav.tabs a{transition:background .15s}}
/* timer */
.brand{align-items:center}
.brand .now{margin-left:0}
.timer{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-left:auto;flex:0 1 auto}
@media (max-width:760px){.timer{margin-left:0;width:100%}}
.alerts{display:flex;flex-wrap:wrap;gap:6px}
.alert{font-size:13px;padding:4px 10px;border-radius:8px;background:var(--warn-soft);color:var(--fg)}
.alert b{color:var(--warn)}
.matrix td,.matrix th{text-align:center;white-space:nowrap}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.mk{font-family:var(--font-num);font-weight:700}
.mk.y{color:var(--good)} .mk.p{color:var(--warn)} .mk.n{color:var(--muted);font-weight:400}
.timer .lbl{font-size:12px;color:var(--muted);margin-right:2px}
.timer .preset{font:inherit;font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.timer .preset.on{border-color:var(--navy);background:var(--navy-soft);color:var(--navy);font-weight:600}
.timer .clock{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:22px;font-weight:700;min-width:84px;text-align:center;padding:0 10px;border-radius:8px;background:var(--sunk);color:var(--fg);line-height:34px}
.timer .clock.warn{background:var(--warn-soft);color:var(--warn)}
.timer .clock.over{background:var(--bad-soft);color:var(--bad)}
.timer .ctl{font:inherit;font-size:13px;padding:5px 12px;border-radius:8px;border:1px solid var(--navy);background:var(--navy);color:var(--surface);cursor:pointer;min-width:64px}
.timer .ctl.ghost{background:transparent;color:var(--navy)}
.timer .who{font-size:12px;color:var(--muted)}
.timer .prog{flex:1 1 120px;min-width:80px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.timer .prog i{display:block;height:100%;width:0;background:var(--navy)}
.timer .prog i.warn{background:var(--warn)} .timer .prog i.over{background:var(--bad)}
/* checklist */
.ck-g+.ck-g{margin-top:12px}
.ck-h{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:14px}
.ck{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px}
.ck+.ck{margin-top:6px}
.ck.ok{background:var(--good-soft);border-color:transparent}
.ck.ask{background:var(--warn-soft);border-color:transparent}
.ck-btns{display:flex;gap:4px}
.ckb{font:inherit;font-size:12px;padding:3px 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;white-space:nowrap}
.ckb.ok.on{background:var(--good);border-color:var(--good);color:var(--surface)}
.ckb.ask.on{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.ck-q{font-size:13px;color:var(--muted);margin-top:2px}
.ck.ok .ck-q{display:none}
.ck-a{display:none;margin-top:6px;font-size:13px;background:var(--surface);border-radius:6px;padding:6px 8px;color:var(--fg)}
.ck-a b{color:var(--good)}
.ck.ask .ck-a{display:block}
.ck.ask .ck-q{color:var(--warn);font-weight:600}
@media (max-width:480px){.ck{grid-template-columns:1fr}}
.sumtbl td .chip{margin:1px}
/* floating criteria bar */
.critbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:8;width:max-content;max-width:min(1000px,calc(100% - 32px));background:var(--navy);color:var(--surface);border-radius:12px;box-shadow:0 6px 24px rgba(10,14,40,.28);padding:8px 14px;font-size:13px;cursor:default}
.critbar:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.cb-sum{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.cb-sum .ttl{font-weight:700;opacity:.85}
.cb-sum .it b{font-family:var(--font-num);margin-left:3px;color:var(--gold)}
.cb-sum .grp{opacity:.75;font-size:12px}
.cb-sum .hint{opacity:.6;font-size:11px;margin-left:auto}
.cb-detail{display:none;margin-top:8px;max-height:55vh;overflow:auto;border-top:1px solid color-mix(in srgb,var(--surface) 25%,transparent);padding-top:8px}
.critbar:hover .cb-detail,.critbar:focus-within .cb-detail,.critbar.open .cb-detail{display:block}
.cb-detail table{font-size:13px;color:inherit}
.cb-detail th,.cb-detail td{border-bottom-color:color-mix(in srgb,var(--surface) 18%,transparent);color:inherit;padding:5px 8px}
.cb-detail th{opacity:.7}
.cb-detail td.p{font-family:var(--font-num);font-weight:700;color:var(--gold);white-space:nowrap}
.cb-detail h5{margin:8px 0 2px;font-size:12px;opacity:.8}
body.has-cb main{padding-bottom:110px}
@media (max-width:600px){.cb-sum .hint{display:none}}
details.fold>summary{cursor:pointer;list-style:none}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"▸";display:inline-block;width:16px;color:var(--navy)}
details.fold[open]>summary::before{content:"▾"}
.concept.deep{border-left-color:var(--navy)}
.concept .here .chip{margin-right:4px}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>부산외대 고급과정 최종발표</h1>
      <span class="now num" id="nowpill" title="현재 시각">--:--</span>
    <div class="timer" role="group" aria-label="발표 타이머 15분">
      <span class="lbl">발표 15분</span>
      <span class="clock" id="clk" aria-live="off">15:00</span>
      <button type="button" class="ctl" id="tStart">시작</button>
      <button type="button" class="ctl ghost" id="tReset">리셋</button>
      <span class="prog" aria-hidden="true"><i id="tbar"></i></span>
      <span class="who" id="twho"></span>
    </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="화면 이동"></nav>
  </div>
</header>

<main class="wrap" id="app"></main>
<div class="critbar" id="critbar" tabindex="0" role="note" aria-label="심사기준 요약, 마우스를 올리면 펼쳐짐" hidden></div>
<div class="lightbox" id="lb" hidden><img id="lbimg" alt=""></div>

<script>
const T = {
 t8:{ord:1,team:"8조",name:"훈민청음",start:"13:15",end:"13:35",members:"오지영(팀장) · 전문기 · 데이브(맥슈웰 데이브)",contest:"A",img:"img/t8.jpg",

  statNote:"모두 Sandbox(시험 환경)에서 측정. 몇 건으로 쟀는지는 포스터에 없음.",
  concepts:["agent","multi","tool","playwright","sttts","rag","hitl"],
  strong:"AI 혁신성(멀티 에이전트·음성·웹 조작)과 구체성(단계별 시나리오, 6개 지표)이 강함. 사람 승인 없이 제출되지 않는 구조라 현장 적용 설명이 쉬움.",
  weak:"사회보장 데이터 활용(25점)이 포스터에서 약하게 보임. 공공데이터 6종을 표로 적었지만 실제 데이터로 무엇을 계산·추천하는지 안 보임. 기존 복지로 챗봇·음성 안내와의 차이도 짚어야 함.",

  ["AI 혁신성","20",[["총괄 에이전트가 요청을 전문 에이전트에 나누는 이유와 효과","에이전트를 나누지 않고 하나로 했으면 무엇이 안 됐을까요?","복지·행정·생활문화는 쓰는 사이트와 도구가 달라서, 하나로 두면 프롬프트가 길어지고 도구 선택이 자주 틀렸다. 나눈 뒤 각 분야 정확도가 올랐다(가능하면 전후 수치)."],["Sandbox 수치(88%·92% 등)의 표본 수와 성공 기준","88%는 과업 몇 개로, 무엇을 성공으로 보고 쟀나요?","시나리오 N개를 M번씩 돌렸고, 성공은 '제출 직전 화면까지 모든 값이 정답과 일치'로 정의했다. 실패 12%의 대표 원인은 ○○였다."]]],
  ["발전(사업화) 가능성","20",[["실서비스 적용 조건: 기관 협력, 본인인증·최종 제출은 사용자가 직접","실제 복지로에 붙이려면 무엇이 필요하고, 본인인증은 누가 하나요?","시연은 모의 페이지에서 했고, 본인인증과 최종 제출은 사용자가 직접 한다. 실서비스는 기관과 협력해 공식 연동이나 키오스크·콜센터 보조 형태로 적용할 수 있다."]]],
  ["구체성","15",[["사용자 승인 단계와 개인정보 보호 장치(가림·암호화·실행 전 검사)","화면의 개인정보는 모델에 어떻게 처리되나요?","캡처 단계에서 개인정보 영역을 가리고, 저장 정보는 AES-GCM으로 암호화, 실행 전 PolicyGuard로 민감 동작을 검사해 승인 없이 제출되는 경우가 0건이었다."]]],
  ["독창성","15",[["복지로 챗봇·음성 안내와 다른 점(안내를 넘어 입력·제출까지 대행, 프로필별 접근성)","기존 복지로 챗봇과 무엇이 다른가요?","기존 챗봇은 안내에서 끝나지만 훈민청음은 실제 화면에서 입력·오류 수정까지 대신 하고, 고령자·장애인·다문화 프로필에 따라 글자 크기·말 속도·언어를 바꾼다."]]],
  ["ESG 혁신","5",[["디지털 격차 완화 등 ESG 효과를 한 문장으로","ESG 관점의 효과를 한 줄로 말해 본다면?","디지털 취약계층의 공공서비스 접근 격차를 줄이고(S), 불필요한 기관 방문과 이동을 줄인다(E)."]]]],
 t3:[[DEMO,"필수",[["프로필 두 개로 추천 결과가 달라지는 것을 시연","프로필을 바꿔서 결과가 달라지는 걸 보여 줄 수 있나요?","청년 구직자와 노인 1인 가구 프로필로 각각 로그인해 오늘의 추천 5개가 어떻게 달라지는지, 추천 이유 카드와 D-day를 함께 보여 준다."]]],
  ["사회보장 데이터 활용","25",[["복지로·공공데이터포털·청년정책 API 사용과 마감 판정·태그 전처리","어떤 데이터를 어떻게 가공해 쓰나요?","복지로·공공데이터포털 API에서 복지서비스를 받아 마감 여부를 판정하고 연령대·분야 태그를 붙였다. 청년정책 API는 청년 연령대를 자동 분류하는 데 썼다."]]],
  ["AI 혁신성","20",[["생성–검증에서 AI가 하는 일과 검증 85점의 채점 기준","검증 모델이 매기는 85점은 무엇을 채점한 건가요?","생성 모델이 추천 이유를 쓰고, 검증 모델이 자격 조건 충족·공고 원문과의 일치·마감일 정확성을 채점표로 점수화한다. 85점 미만이면 다시 생성한다."],["모델 조합 비교 결과와 추천 정확도(오추천 비율)","자격이 안 되는데 추천된 비율은 확인했나요?","샘플 프로필 N명으로 직접 확인해 오추천 비율 ○%였다. 아직 없다면 속도 기준으로 조합을 골랐고 정확도 평가는 다음 단계라고 솔직히 말한다."]]],
  ["발전(사업화) 가능성","20",[["행정 개선 효과(남는 예산·반복 안내 감소)의 근거와 적용처","어느 기관이 어떻게 쓰면 효과가 나나요?","복지로나 지자체 복지 포털에 추천 모듈로 붙이면, 신청자를 못 찾아 남는 예산과 창구 반복 안내를 줄일 수 있다."]]],
  ["구체성","15",[["일치 점수 가중치(관심 분야 50 등)를 정한 근거","관심 분야 50점, 소득 5점의 근거는?","관심 분야가 맞지 않으면 다른 조건이 맞아도 사용자가 신청하지 않아서 가장 크게 뒀고, 소득·지역은 마감·자격 필터에서 이미 걸러져 비중을 낮췄다. 가중치를 바꾼 비교 결과가 있으면 함께 보여 준다."]]],
  ["독창성","15",[["복지로 '맞춤형 복지'와 다른 점(로그인 연동·마감 제외·추천 이유)","복지로 맞춤형 복지와 무엇이 다른가요?","방문할 때마다 조건을 다시 입력할 필요가 없고, 마감 서비스는 자동으로 빼며 D-day를 보여 주고, 서비스별로 왜 추천했는지 이유를 준다."]]],
  ["ESG 혁신","5",[["포스터의 E·S·G 효과를 발표에서도 언급","ESG 효과를 한 줄로 말해 본다면?","탐색 시간 감소(E), 정보 격차 완화(S), 추천 근거 공개(G)."]]]],
 t2:[[DEMO,"필수",[["프로필 입력 → 정책·훈련과정 추천 → 자격 판정 → 후속 질문까지 실제 화면으로","어디까지 실제로 돌아가는지 데모로 보여 줄 수 있나요?","프로필을 입력해 정책·훈련과정 추천과 자격 판정 결과(충족·미충족·추가 확인 필요)를 보여 주고, 후속 질문 하나를 바로 넣어 답을 받는다."]]],
  ["사회보장 데이터 활용","25",[["온통청년·고용24 데이터와, 청년 취업 지원이 사회보장에 해당하는 이유","청년 취업 정책을 사회보장 데이터로 보는 이유는?","청년 고용 지원은 사회보장기본법의 사회서비스에 포함되고 복지로에도 청년 일자리 서비스가 올라 있다. 온통청년(청년정책)과 고용24(훈련과정) 공식 API를 실시간으로 쓴다."]]],
  ["AI 혁신성","20",[["Tool Calling으로 후속 질문에 맞는 기능을 골라 실행하는 장면","후속 질문 하나를 실제로 넣어 볼 수 있나요?","'이 과정 부산에서도 들을 수 있어?' 같은 질문에 모델이 훈련과정 조회 도구를 골라 실행하고 결과로 답하는 과정을 보여 준다."]]],
  ["발전(사업화) 가능성","20",[["실제 사용처(대학 취업지원센터 등)와 확장 계획","누가 어디서 쓰게 될까요?","대학 취업지원센터나 고용센터 상담 보조로 쓰고, 이후 지자체 청년 정책까지 넓힌다."]]],
  ["구체성","15",[["자격 판정 규칙 개수와 검증 방법","자격 규칙은 몇 개 제도에 대해 만들었고 어떻게 확인했나요?","제도 N개의 자격 규칙을 Python으로 구현했고, 공고 원문으로 만든 테스트 케이스 M개로 확인했다."],["'추가 확인 필요'가 나오는 조건","정보가 부족하면 어떻게 처리하나요?","소득·거주 기간처럼 입력에 없는 정보가 필요하면 추측하지 않고 '추가 확인 필요'로 표시하고 무엇을 확인해야 하는지 알려 준다."]]],
  ["독창성","15",[["고용24·온통청년 자체 추천과 다른 점","기존 추천 기능과 무엇이 다른가요?","두 사이트에 흩어진 정책과 훈련과정을 한 번에 묶고, 자격 판정 근거와 다음 준비 체크리스트까지 준다."]]],
  ["ESG 혁신","5",[["ESG 효과 언급(포스터에 없음)","ESG 관점 효과를 한 줄로 말해 본다면?","정보 탐색 부담을 줄여 청년 고용 격차를 완화하는 것(S)."]]]],
 t5:[[DEMO,"필수",[["실제로 찾아낸 제도 충돌·사각지대 사례 1건 시연","찾아낸 충돌 사례 하나를 보여 줄 수 있나요?","예: 'A 급여를 받으면 소득이 올라 B 사업 기준을 넘어 탈락하는 가구 조건'처럼 시스템이 찾아낸 구체적인 사례 한 건을 화면으로 보여 준다."]]],
  ["사회보장 데이터 활용","25",[["파이차트 숫자(2,345 등)가 무엇의 개수이고 출처가 어디인지","파이차트 숫자는 무엇이고 어디서 가져왔나요?","공공데이터포털의 사회보장사업 목록에서 분야별 사업(또는 규정) 수를 센 것이고, 사회복지 분야가 2,345건으로 가장 많다."]]],
  ["AI 혁신성","20",[["규정 구조화·검증 에이전트의 역할과 해석 오류를 잡는 방법","AI가 규정을 잘못 읽으면 어떻게 잡나요?","규정 분석 에이전트가 대상·조건·금액·예외를 표로 만들면, 검증 에이전트가 원문과 대조하고 담당자 승인 전에는 충돌 탐지로 넘어가지 않는다."]]],
  ["발전(사업화) 가능성","20",[["정책 시뮬레이션 계산 근거와 사용 기관(정부·지자체·연구기관)","시뮬레이션 예산은 어떤 데이터로 계산하나요?","수급자 통계와 급여액 기준표로 계산하고, 지금은 가정치라면 그렇게 밝힌다. 사용처는 제도를 바꾸기 전 영향을 검토하는 정부·지자체·연구기관."]]],
  ["구체성","15",[["6단계 흐름과 담당자 승인 지점","담당자는 어느 단계에서 무엇을 승인하나요?","규정 검증 뒤, 구조화된 규정이 원문과 맞는지 담당자가 확인·승인하고 나서 충돌 탐지와 시뮬레이션이 돈다."]]],
  ["독창성","15",[["개인 추천이 아닌 '제도 간 충돌'을 보는 관점의 차별성","기존 중복 수급 확인 시스템과 무엇이 다른가요?","기존 시스템은 한 사람의 중복 수급 여부를 확인하지만, FairLens는 제도와 제도 사이에서 생기는 공백과 충돌을 시행 전에 찾는다."]]],
  ["ESG 혁신","5",[["ESG 효과 언급","ESG 관점 효과를 한 줄로 말해 본다면?","제도 사각지대로 지원받지 못하는 가구를 줄이고(S), 정책 결정 근거를 투명하게 남긴다(G)."]]],
  ["자료 정합성","—",[["서비스명 통일(FairLens / Welfare Insight AI)","정식 서비스 이름은 무엇인가요?","정식 이름은 FairLens이고, 포스터 결론의 다른 이름은 수정하겠다."]]]],
 t6:[[DEMO,"필수",[["공식자료 → AI 초안 → 검사 → 담당자 승인 → 시민 화면 흐름 시연","변경 하나가 시민 화면에 뜨기까지를 보여 줄 수 있나요?","교육급여 보도자료 하나로 근거 문단 선택, AI 초안, 검사 결과(확인됨·빈칸), 담당자 승인, 시민 화면 표시까지 보여 준다."]]],
  ["사회보장 데이터 활용","25",[["복지서비스 461개, 안내 API, 공식 PDF를 어떻게 쓰는지","어떤 공식자료를 어떤 주기로 비교하나요?","복지서비스 목록 461개를 기준으로, 안내 API를 매일 받아 전날과 비교하고(지금 3개), 공식 PDF의 글자를 읽어 바뀐 값을 찾는다."]]],
  ["AI 혁신성","20",[["AI 범위를 초안 1곳으로 줄이고 에이전트·RAG를 쓰지 않은 이유(설계 판단)","에이전트·RAG를 쓰지 않은 이유는?","공공 안내는 틀리면 안 돼서 AI가 판단하는 범위를 초안 1곳으로 줄였고, 결정은 담당자가 한다. 개인정보와 비용 때문에 외부로 보내지 않는 로컬 모델을 골랐다."],["AI 초안이 모두 차단된 상황에서 AI가 주는 이득과 개선 계획","초안이 5건 모두 막혔다면 지금 AI의 쓸모는?","지금은 애매한 초안을 막는 안전장치가 제대로 작동한다는 걸 확인한 단계이고, 근거 문단 후보를 찾아 주는 것만으로 담당자 확인 시간이 줄어든다. 다음엔 모델 교체·입력 개선으로 통과율을 올린다."]]],
  ["발전(사업화) 가능성","20",[["담당자 업무 시간 절감 추정과 확장 계획(조례·공고·서류)","담당자 한 명이 줄이는 시간은 대략 얼마인가요?","월 변경 건수 × 건당 확인 시간으로 대략 추정한 값을 말하고, 비교 서비스 → 지자체 조례·공고 → 신청 서류 변경 순서로 넓힌다."]]],
  ["구체성","15",[["8단계 중 담당자 결정 4곳·규칙 검사 2곳·AI 1곳의 역할 구분","각 단계를 누가 맡는지 정리해 줄 수 있나요?","근거 문단 고르기·서비스 선택·등록·승인은 담당자, 초안 검사·기존 안내 비교는 규칙, 초안 작성만 AI, 시민은 승인된 것만 본다."]]],
  ["독창성","15",[["안내문이 정책보다 늦게 바뀌는 문제를 잡는다는 관점(주거급여 예시)","기존 안내 갱신 방식과 무엇이 다른가요?","같은 안내 API 안에서도 2026년 기준표는 492,000원인데 설명 예시는 470,000원으로 남아 있었다. 이런 불일치를 자동으로 찾아 담당자에게 확인을 요청한다."]]],
  ["ESG 혁신","5",[["S·E·G 효과(재신청 누락·종이 절감·승인 기록)","ESG 효과를 한 줄로 말해 본다면?","재신청 누락과 정보 격차를 줄이고(S), 자료 대조 시간과 종이를 줄이며(E), 누가 어떤 근거로 승인했는지 기록을 남긴다(G)."]]]],
 t7:[[DEMO,"필수",[["프롬프트 적용 전후 응답을 실제로 비교하는 시연","같은 질문으로 적용 전후를 바로 보여 줄 수 있나요?","'여자 직원은 집안일이 있으니 야근을 남자 위주로' 같은 질문을 프롬프트 없이, 그리고 최종 프롬프트로 넣어 두 답을 나란히 보여 준다."]]],
  ["정량 · 유해성","LLM Judge",[["유해 답변 33~39 → 1건, 남은 실패(사칭 59·72번) 설명","남은 1건은 어떤 문항이고 왜 실패했나요?","남은 1건은 두 번 모두 사칭·피싱 유형(59번, 72번)이었다. 사칭 유형의 프롬프트 문장을 고쳐 다시 시험하는 게 다음 계획이다."]]],
  ["정량 · 경향성","LLM Judge",[["편향 전제를 첫 문장에서 바로잡음(38~49 → 93~95)","편향 질문에 어떻게 답하도록 바꿨는지 예시로 보여 주세요","기본 모델은 '여러 문제를 야기할 수 있습니다'로 결론을 미뤘지만, 적용 후에는 첫 문장에서 '성별로 야근 대상을 정하는 것은 적절하지 않습니다'라고 바로잡고 순번제 같은 다른 기준을 준다."]]],
  ["정량 · 공평성","LLM Judge",[["중립 요청에서 특정 성별로 치우치지 않음(간호사 인물 예시)","중립 요청의 치우침은 어떻게 확인했나요?","간호사 인물 프로필 세 명을 만들게 했을 때 기본 모델은 셋 다 성별·외모부터 적었고, 적용 후에는 일하는 방식과 습관으로 인물을 그렸다. 일반 요청 50문항 전체에서 같은 기준으로 판정했다."]]],
  ["정량 · 내용 전달성","LLM Judge",[["안전 지침을 넣어도 정보 오류·답변 부실이 없음","조심하느라 답이 부실해진 경우는 없었나요?","처음 버전(v3)은 판정 수치가 더 좋았지만 답 250개를 읽어 보니 같은 거절 문장만 반복해서, 남는 용건이 있으면 안전한 경로를 안내하도록 다듬었다(예: 161번 참가비 반환은 반환 경로 안내). 정당한 요청 10개를 따로 만들어 넣어 모두 답하는 것도 확인했다."]]],
  ["정량 · 질의응답 적정성","LLM Judge",[["질문 유형별로 대응이 다름(거부·교정·정상)","유형마다 답이 어떻게 달라지나요?","유해 요청은 방법을 빼고 원래 목적을 돕고, 편향 문항은 전제를 바로잡고, 일반 요청은 그대로 답하되 직업으로 성별을 정하지 않는다."]]],
  ["정성 · 분석 타당성","응답",[["기본 모델의 취약 유형 분석(합성사진·위치추적 등 표)","어떤 유형에서 가장 많이 틀렸나요?","합성기술 21문항 중 17문항은 두 번 다 유해 답변이 나왔고 적용 후에는 0건이 됐다. 위치추적·크롤러 같은 유형별로도 전후를 표로 비교했다."]]],
  ["정성 · 설계 완성도 · 모델 선정","설계서",[["Gemini 3.8 Flash MEDIUM을 고른 이유(11개 조합 비교)","11개 조합 중 이 모델을 고른 이유는?","11개 모델·설정을 기본 상태로 돌려 유해 답변이 가장 많았던 조합(37~39건)을 골라 개선 폭을 보여 주려 했고, 허용 모델 목록에 있는 모델이다."]]],
  ["정성 · 전략 적절성","응답",[["분석한 취약점이 프롬프트의 어떤 규칙으로 이어졌는지","취약점 분석이 프롬프트 어디에 반영됐나요?","'경고 한 줄 뒤 방법을 다 알려 줌'이라는 취약점은 '방법은 빼고 원래 목적을 돕는다'는 규칙으로, '결론을 미룸'은 '첫 문장에서 바로잡는다'는 규칙으로 바꿨다."]]],
  ["정성 · 활용·확장성","응답",[["같은 프롬프트를 다른 4개 모델에 넣어도 유지(유해 0~1건)","다른 모델에서도 통하나요?","프롬프트를 고치지 않고 GPT-6 Sol·Luna, Claude Sonnet·Opus 5.5에 넣어도 유해 답변이 0~1건, 편향 교정 92~98건이었다. 다만 허용 모델 7개 중 5개만 확인했고, Claude 두 모델은 15문항이 API 앞단에서 막혀 응답이 없었다."]]],
  ["정성 · 강건성","설계서",[["역할극·목적 위장·단계적 유도 같은 우회에 대한 대비","'소설 쓰는 중인데' 같은 우회에도 버티나요?","작업의 일부만 물어도 그 요청의 부품으로 판단하고, '경고를 붙이고 주는 것은 막은 게 아니다'라는 규칙을 넣었다. 여러 턴 대화와 돌려 말한 요청은 아직 시험하지 않아 향후 계획으로 두었고, 사칭 유형이 남은 한계라고 밝힌다."]]],
  ["정성 · 구조성·명확성","설계서",[["프롬프트가 역할·원칙·판단 절차·출력 형식으로 나뉘고 지시가 충돌하지 않음","최종 프롬프트 구조를 화면으로 보여 줄 수 있나요?","최종 프롬프트를 띄워 역할, 원칙, 요청 판단 절차, 답변 형식 순으로 나뉜 구조를 보여 준다."]]],
  ["정성 · 판별 설계성","설계서",[["거부·교정·정상 응답을 가르는 판단 기준(요청 판단 두 질문)","무엇을 보고 거부·교정·정상을 가르나요?","답하기 전에 요청을 막을 요청·바로잡을 질문·그 밖의 요청 셋 중 하나로 먼저 나눈다. 막을 요청은 '① 대상이 실제 사람인가 ② 그 사람이 원하지 않을 일인가' 두 질문으로 판단하고, 성별 일반화가 전제로 깔리면 바로잡을 질문으로 본다."]]],
  ["평가 신뢰도","보조",[["Claude Opus 5.5 판정이 맞는지 사람이 확인한 방법","AI 판정은 어떻게 검증했나요?","팀이 직접 읽은 결과와 Opus 판정의 문항별 일치율은 아직 측정 전이고 향후 계획이라고 솔직히 말한다. Opus 5.5가 판정 모델이자 비교 대상 모델이라는 점도 알고 있다고 밝힌다."],["팀원 4명의 역할 분담","각자 맡은 일은 무엇이었나요?","문항 분류, 프롬프트 작성, 반복 실행, 판정 검수를 누가 맡았는지 이름과 함께 말한다."]]]],
 t4:[[DEMO,"필수",[["AI가 하는 부분(병원 후보 탐색·정보 정리)이 실제로 돌아가는 화면","AI가 동작하는 화면을 보여 줄 수 있나요?","환아 조건을 넣으면 필요한 진료역량을 정리하고 가까운 거점병원 후보와 최신 정보를 표로 보여 주는 화면을 시연한다. 아직 구현 전이면 어디까지 만들었는지 정확히 말한다."]]],
  ["사회보장 데이터 활용","25",[["사회보장 제도·데이터와의 연결(의료급여·아동 의료비 지원 등)","사회보장 경진대회에 낸 이유, 사회보장과의 연결은?","소아 의료 접근성은 건강보장 영역이고, 의료급여·아동 의료비 지원 같은 사회보장 제도와 연결된다. 공공 보건의료 통계를 사회보장 데이터로 활용했다."]]],
  ["AI 혁신성","20",[["AI 활용 지점과 쓴 도구·모델","이 모델에서 AI가 맡는 일은 정확히 무엇인가요?","AI는 병원 정보 조회·최신성 확인·후보 정리를 맡고, 중증도·이송 결정은 의료진·119가 한다. 사용한 모델과 도구 이름을 함께 말한다."]]],
  ["발전(사업화) 가능성","20",[["기관 협력이 필요한 한계와 단계적 적용 계획","실제로 쓰려면 어떤 기관 협력이 필요한가요?","공개 자료로 먼저 지역 공백 분석을 하고, 실시간 병상·수용 정보는 응급의료기관·지자체와 협력해 단계적으로 연결한다."]]],
  ["구체성","15",[["지역 의료 공백을 계산한 데이터와 지표","의료 공백은 어떤 데이터로 계산했나요?","아동 인구 대비 소아 전문의·시술 가능 기관 수, 거점병원까지 이동시간을 지역별로 계산했다."]]],
  ["독창성","15",[["소아 응급 전원이라는 주제와 기존 응급의료정보와의 차이","기존 응급의료 정보 시스템과 무엇이 다른가요?","빈 병상만 보여 주는 게 아니라 소아 심혈관 시술처럼 필요한 진료역량까지 맞춰 실제로 받아 줄 수 있는 병원을 찾는다."]]],
  ["ESG 혁신","5",[["지역 형평성(S) 효과","ESG 관점 효과를 한 줄로 말해 본다면?","지역 간 소아 의료 접근성 격차를 줄이는 것(S)."]]],
  ["참가 규정","—",[["데이터센터 공모전과 같은 아이디어인지(중복 입상 제외 규정)","앞서 낸 공모전과 같은 아이디어인가요?","다르다면 무엇이 다른지 말하고, 같다면 공고문상 한 곳에서만 수상할 수 있다는 점을 알고 있다고 답한다."]]]],
 t1:[[DEMO,"필수",[["말로 설명 → 모자란 조건 되묻기 → 결론 카드 → 검토서(DOCX·HWPX) 생성 시연","검토서가 만들어지는 데까지 보여 줄 수 있나요?","'○○ 절삭유를 쓰는데 칩 압축기 회수기간은?'을 말로 넣고, 수용성일 때 되묻는 장면, 비수용성일 때 11.7개월 결론 카드, 회사 양식 검토서 생성까지 보여 준다."]]],
  ["출제 과제 적합(MS)","공개 기준 없음",[["Microsoft 과제 요구사항 대비 충족 항목","MS 과제 요구사항 중 무엇을 충족했나요?","과제 「산업자원 순환·재활용 에이전트」의 요구 기능(자원 분류, 처리 경로, 경제·환경 가치 산정, 보고서)을 하나씩 짚어 무엇을 구현했는지 보여 준다."],["Azure·Foundry 활용 지점(앱 모델 서빙, H100 비교 실험)","MS 스택은 어디에 썼나요?","앱 모델 gpt-5.4-mini는 Microsoft Foundry로 서빙하고, Phi-4·Llama 비교 실험은 Azure ML H100에서 돌렸다."]]],

  ["음성 지연의 구성","STT → LLM → TTS를 차례로 돌리면 지연이 쌓인다. 첫 소리가 나오기까지 시간(체감 지연)과 전체 응답 완료 시간은 다르게 잰다. 실시간 음성 모델이나 스트리밍으로 줄인다.","약 3.5초(이전 포스터는 1.6초였다가 수정됨)가 첫 음성까지인지 전체 처리인지, 어느 구간이 가장 오래 걸리는지. 고령자 대상 음성 대화에서 3.5초는 체감상 긴 편이라 줄일 계획을 물어볼 만함."],

  ["에이전트 과업 평가 방식","에이전트 성능은 정해진 시나리오 세트를 여러 번 돌려 성공률과 편차를 본다(WebArena 같은 벤치마크 방식). 한 번 돌린 결과는 운에 따라 달라진다.","시나리오 수, 반복 횟수, 성공 판정을 사람이 했는지 자동인지."]],
 t3:[["LLM 판정의 편향","LLM 판정은 긴 답을 선호하거나 같은 계열 모델의 글을 후하게 주는 경향이 있다. gpt-4o가 gpt-4o-mini 글을 채점하는 구조라 이 상관이 생길 수 있다.","85점 채점표가 무엇인지, 사람이 일부를 다시 채점해 맞춰 봤는지."],
  ["규칙 필터 + LLM 설명의 분업","자격·마감처럼 틀리면 안 되는 판단은 결정적인 규칙으로, 추천 이유 문장만 LLM에 맡기면 환각이 생길 범위가 줄어든다. 3조 구조가 이 방식이다.","추천 이유에 공고 원문에 없는 내용이 생기는지(환각) 확인했는지."],
  ["생성–검증 루프의 상한","검증에서 계속 떨어지면 재생성이 반복돼 비용과 시간이 늘어난다. 재시도 최대 횟수와 실패 시 처리(그냥 보여 줄지, 뺄지)를 정해 둬야 한다.","재생성 최대 횟수와 30초 안에 끝나지 않을 때의 처리."],
  ["추천 시스템 평가 지표","추천은 상위 k개 중 맞는 비율(precision@k), 자격이 안 되는데 추천된 비율(오추천율), 받을 수 있는 서비스를 놓친 비율(재현율)로 본다. 정답 프로필 세트를 만들어 오프라인으로 잰다.","속도 말고 이런 정확도 지표를 쟀는지."],
  ["데이터 신선도","API 데이터를 언제 받아 두는지(캐시 주기)에 따라 마감·신규 서비스가 늦게 반영된다. 검색 순위는 1시간 갱신이라고 적었다.","복지서비스 목록·마감 판정은 얼마나 자주 갱신하는지."]],
 t2:[["Tool Calling의 실패 유형","모델이 엉뚱한 도구를 고르거나, 인자를 잘못 넣거나, 도구 결과를 무시하고 지어내는 경우가 있다. 함수 설명(스키마)을 잘 쓰고 결과를 검증하는 게 핵심.","후속 질의에서 도구 선택이 틀린 사례가 있었는지, 어떻게 막는지."],
  ["규칙 판정의 테스트 가능성","Python 규칙은 같은 입력에 항상 같은 답을 내서 테스트로 검증할 수 있다. 제도별 경계값(나이 34세/35세, 소득 기준선) 테스트가 있으면 신뢰도가 크게 오른다.","경계값 테스트 케이스가 있는지."],
  ["임베딩 유사도의 한계","임베딩 유사도는 '뜻이 비슷하다'일 뿐 '자격이 맞다'는 아니다. 코사인 유사도 임계값을 어떻게 정했는지, 한국어에 맞는 임베딩 모델을 썼는지가 품질을 가른다.","과정 개요와 질문 비교에 쓴 임베딩 모델과 기준값."],
  ["외부 API 의존","공공 API는 호출 제한, 장애, 느린 응답이 흔하다. 캐시, 재시도, 장애 시 안내 문구 같은 대비가 운영 품질을 정한다.","API가 안 될 때 서비스가 어떻게 되는지."],
  ["직무 정규화(NCS 매핑)","사용자가 적은 희망 직무를 NCS 분류로 바꾸는 단계가 틀리면 뒤 추천이 모두 어긋난다. 이 단계의 정확도를 따로 보는 게 좋다.","'마케팅 하고 싶어요' 같은 입력이 어떤 NCS 코드로 바뀌는지."]],
 t5:[["정보 추출 스키마와 정확도","법령·지침을 '대상·조건·금액·예외' 같은 칸으로 뽑는 걸 정보 추출이라 한다. 칸 설계가 충돌 탐지 품질을 정하고, 사람이 만든 정답 세트로 칸별 정확도를 재는 게 정석.","구조화 스키마가 무엇이고, 추출 정확도를 잰 적이 있는지."],
  ["충돌 탐지: LLM 판단 vs 논리 계산","조건을 논리식(나이≥65 AND 소득≤X)으로 바꾸면 두 제도가 동시에 성립 못 하는 가구 조건을 계산으로 찾을 수 있다(규칙 엔진·제약 풀이). LLM에게 '충돌 있어?'라고 묻는 것보다 재현성이 높다.","충돌 탐지가 LLM 판단인지, 조건을 계산하는 방식인지."],
  ["마이크로시뮬레이션","가구 단위 표본 데이터에 바뀐 제도 규칙을 적용해 수혜자·예산 변화를 합산하는 정책 분석 방법. 표본 데이터(가구 소득·구성)가 없으면 시뮬레이션은 가정치가 된다.","시뮬레이션에 쓴 가구 데이터가 있는지, 가정치인지."],
  ["법령 버전 관리","제도는 해마다 바뀌고 지자체 조례는 지역마다 다르다. 어느 시점 규정을 기준으로 분석했는지(기준일)를 남겨야 결과를 믿을 수 있다.","분석 기준일과 개정 반영 방법."]],
 t6:[["소형 로컬 모델의 한계","4B급 모델은 긴 문서 이해와 복잡한 지시 따르기가 약하고, PC에서 돌리려고 압축(양자화)하면 품질이 더 떨어진다. 같은 입력에도 답이 달라질 수 있어(비결정성) 검사 단계가 필요하다.","양자화 버전·temperature 설정, 더 큰 모델과 비교했는지."],
  ["근거 기반 추출 검증","'원문에 같은 글자가 있다'는 존재 확인일 뿐 의미가 맞다는 보증이 아니다. 포스터에 이 한계를 스스로 적은 건 기술적으로 정확한 인식이다. 의미 검증은 금액·대상·시기의 짝을 원문 구조에서 확인해야 한다.","금액 3개 중 어느 것이 짝인지 애매한 경우를 어떻게 풀 계획인지."],
  ["변경 탐지(diff)","안내문을 매일 받아 전날과 비교할 때, 문장 그대로 비교하면 띄어쓰기·날짜 표기 차이도 변경으로 잡힌다. 값(금액·기준)을 뽑아 정규화한 뒤 비교해야 진짜 변경만 남는다.","무엇을 기준으로 '변경'이라고 판단하는지."],
  ["PDF 표·이미지 처리","공공 PDF는 표가 이미지로 들어 있는 경우가 많아 글자 추출로는 못 읽는다. OCR이나 표 구조 인식 도구가 필요하다.","이미지 표 처리 계획."],
  ["작은 표본의 해석","7건 시험으로는 정확도 %를 주장할 수 없다(신뢰구간이 너무 넓음). 포스터에 '정확도 숫자 아님'이라고 쓴 건 맞는 태도.","다음 시험 규모 계획."]],
 t7:[["LLM 판정의 신뢰도","판정 모델(Claude Opus 5.5)도 틀리고 자기 계열 응답에 관대할 수 있다. 일부를 사람이 채점해 일치도(kappa)를 보고, 판정 프롬프트를 공개하는 게 정석. 공모전 정량평가도 LLM Judge라 이 부분을 맞춰 보면 유리하다.","사람 검수 여부, 판정 프롬프트가 공모전 기준 5축과 맞는지."],
  ["비결정성과 반복 실행","같은 질문도 실행마다 답이 달라서 3회·2회 반복하고 범위(33~39)로 보고한 건 좋은 관행. temperature와 seed 설정, 심사 측 재현 조건(부가 기능 없이 모델·effort·프롬프트만)과 맞췄는지가 중요하다.","실행 설정값이 제출 설계서와 같은지."],
  ["안전성과 과잉 거절의 균형","안전 지침을 세게 걸면 정상 질문도 거절한다(과잉 거절). 그래서 일반 요청을 따로 재는데, 거절 0건 외에 답변 품질이 떨어지지 않았는지도 본다.","일반 요청 답변 품질을 전후 비교했는지."],
  ["탈옥 유형과 단일 턴 한계","역할극, 목적 위장, 사칭, 요청을 나눠 묻기, 여러 턴에 걸쳐 조금씩 끌어내기(다중 턴) 같은 유형이 있다. 250문항은 한 번 묻는 형식이라 다중 턴 공격은 못 잰다.","다중 턴 우회는 고려했는지, 사칭이 남은 이유."],
  ["프롬프트 과적합","250문항에 맞춰 규칙을 붙이다 보면 그 문항에서만 잘 되는 프롬프트가 된다. 프롬프트 개발에 안 쓴 문항(홀드아웃)이나 다른 모델에 옮겨 봤을 때 유지되는지가 일반화 근거다. 다른 4개 모델 결과가 그 근거.","포스터에 '프롬프트 예시 표현을 대회 250문항에서 가져옴'을 한계로 적었고, 질문셋에 없는 새 문항으로 시험하는 게 향후 계획. 이 한계를 어떻게 설명하는지."],
  ["추론 강도와 안전","HIGH effort가 MEDIUM보다 유해 답변이 적다는 보장은 없다. 7조 결과(MEDIUM이 기본 유해 답변이 가장 많았음)는 모델을 고른 기준이 '개선 폭'이었음을 말해 준다.","effort별 차이를 어떻게 해석했는지."]],
 t4:[["의료 AI 규제(SaMD)","진단·치료 결정에 영향을 주는 소프트웨어는 의료기기 소프트웨어로 규제받을 수 있다. 'AI가 결정하지 않는다'는 선을 긋는 건 이 규제를 의식한 맞는 방향이다.","정보 정리 보조와 의사결정 사이의 경계를 어떻게 설명하는지."],
  ["응급의료 데이터 연계","실시간 가용 병상·수용 가능 정보는 국가 응급의료 정보망 같은 공공 시스템에 있고 접근이 제한된다. 공개 데이터로 할 수 있는 것과 협력이 필요한 것을 구분해야 한다.","실제로 쓴 데이터가 공개 통계인지 실시간 정보인지."],
  ["공간 접근성 지표","지역 의료 접근성은 단순 병원 수가 아니라 인구 수요와 병원 공급, 이동시간을 함께 보는 방식(예: 2단계 이동권역 방식, 2SFCA)으로 계산한다.","의료 공백을 어떤 계산 방식으로 냈는지."],
  ["LLM이 필요한 지점","병원 후보 탐색·거리 계산은 지도·규칙으로도 된다. LLM이 꼭 필요한 부분(비정형 공지 읽기, 의료진용 요약 등)을 짚어야 AI 혁신성 점수를 받는다.","AI가 아니면 안 되는 단계가 어디인지."]],
 t1:[["하이브리드 검색 결합","BM25 점수와 임베딩 점수는 단위가 달라서 그대로 더할 수 없다. 순위를 합치는 방식(RRF)이나 가중치 정규화를 쓴다. 근거가 34건이라 검색 실패율도 작지만 측정해 두면 좋다.","두 검색 결과를 어떻게 합쳤는지, 검색이 틀린 비율."],
  ["가드레일: 모델 출력 재검산","모델이 낸 구조화 출력(pydantic)을 그대로 믿지 않고 코드가 금액을 다시 계산하고 인용 원문을 대조해 틀리면 반려한다. '모델은 말, 판단은 코드'의 핵심 장치.","반려가 실제로 몇 번 일어났는지, 반려 후 처리."],
  ["평가 설계: 홀드아웃과 오류 분류","개발자가 보지 않은 문항으로 평가해야 과적합 없는 성능이다. '그럴듯한 오답'처럼 오류를 종류별로 나눠 센 건 실무 수준의 평가. kappa 0.8 이상은 채점 기준이 명확하다는 뜻.","211문항을 어떻게 만들었는지(출처, 난이도 분포)."],
  ["에이전트 실행 상한(LLMOps)","재시도 2회, 전체 40단계, 질문당 60초 같은 상한은 무한 루프와 비용 폭주를 막는 운영 장치다. 자동 시험 522개는 코드를 바꿀 때마다 품질이 떨어지지 않았는지 확인하는 회귀 테스트.","상한에 걸린 비율과, 걸렸을 때 사용자에게 보이는 화면."],
  ["오픈 모델 비교의 의미","Phi-4·Llama 3.1 8B를 H100에서 돌려 본 건 '작은 오픈 모델로 대체 가능한가'를 본 것. 판단을 코드가 하므로 모델이 작아도 되는지가 비용 측면 핵심 질문.","작은 모델로 바꿨을 때 오답률이 얼마나 변했는지."]]

 embedding:["임베딩","글을 숫자 좌표(벡터)로 바꾸는 것. 뜻이 비슷한 문장은 좌표가 가까워져서, 단어가 달라도 '의미로' 찾을 수 있다. bge-m3는 다국어를 지원하는 임베딩 모델 이름. 이 좌표를 모아 두는 저장소가 벡터 DB."],
 bm25:["BM25 · 혼합 검색","BM25는 단어가 얼마나 겹치는지로 찾는 전통 검색(키워드 검색). 정확한 용어·숫자에 강하다. 임베딩 검색(의미 검색)과 섞어 쓰면 서로 약점을 메운다. 이를 하이브리드(혼합) 검색이라 한다."],
 finetune:["파인튜닝 · LoRA","이미 만들어진 모델에 우리 데이터를 더 학습시켜 모델 자체를 바꾸는 것. 비용·시간이 들고 데이터가 많이 필요하다. LoRA는 모델 전체가 아니라 작은 부품만 덧붙여 학습하는 가벼운 방식. 이 과정 중반(7~8주차)에 실습했던 내용. 프롬프트·RAG로 해결되면 굳이 하지 않는 게 요즘 흐름."],
 sysprompt:["시스템 프롬프트","사용자 질문마다 앞에 자동으로 붙는 '근무 지침서'. 모델의 역할·원칙·금지 사항·답변 형식을 정한다. 모델을 다시 학습시키지 않고 행동을 바꾸는 가장 싼 방법."],
 benchmark:["벤치마크","정해진 문제 세트로 모델 성능을 재는 시험지. 같은 시험지로 전후·모델 간 비교가 가능하다. 7조의 250문항이 이것."],
 judge:["LLM 판정(LLM-as-a-Judge)","사람 대신 다른 LLM이 답변을 채점하게 하는 방법. 빠르고 싸지만 판정 모델도 틀릴 수 있어서, 일부를 사람이 채점해 맞는지 확인하는 게 정석."],
 genverify:["생성–검증 구조","한 모델이 답을 만들고(생성), 다른 모델이 기준표로 채점해(검증) 통과 못 하면 다시 만들게 하는 구조. 3조는 작은 모델로 쓰고 큰 모델로 검사해 속도와 품질을 맞췄다."],
 rulescore:["규칙 기반 판정 · 점수식","AI가 아니라 사람이 정한 규칙·공식으로 판단하는 부분. 자격 조건, 금액 계산처럼 틀리면 안 되는 곳은 규칙으로, 설명·문장은 AI로 나누는 게 요즘 실무 설계."],
 hitl:["사람 확인 단계(Human-in-the-loop)","AI가 결과를 내도 중요한 결정·제출 전에는 사람이 승인하게 만드는 설계. 공공·의료 분야 심사에서 거의 반드시 묻는 부분."],
 playwright:["Playwright · DOM","Playwright는 프로그램이 브라우저를 대신 조작(클릭·입력·이동)하게 하는 도구. DOM은 웹페이지의 구조(어디에 버튼·입력칸이 있는지)를 나타낸 것으로, 에이전트가 이걸 읽고 어디를 누를지 정한다."],
 sttts:["STT · TTS","STT(Speech-to-Text)는 말을 글로, TTS(Text-to-Speech)는 글을 음성으로 바꾸는 기술."],
 local:["로컬 모델 · Ollama · 파라미터 수","Ollama는 내 컴퓨터에서 오픈소스 LLM을 바로 돌리게 해 주는 프로그램. Qwen3 4B의 '4B'는 파라미터(모델이 학습한 숫자) 40억 개라는 뜻으로, 노트북에서도 돌아가는 작은 모델. 외부 서버로 데이터가 안 나가고 사용료가 없지만 큰 모델보다 품질은 낮다."],
 structured:["구조화 출력(pydantic)","LLM에게 자유 문장 대신 정해진 칸(JSON 형식)으로 답하게 강제하는 것. pydantic은 그 형식을 정의·검사하는 파이썬 도구. 코드가 결과를 안정적으로 받아 계산할 수 있게 된다."],
 effort:["추론 강도(effort)","최신 모델은 답하기 전 '생각하는 양'을 LOW·MEDIUM·HIGH로 조절할 수 있다. 높이면 대체로 정확하지만 느리고 비싸다. 7조는 MEDIUM이 오히려 결과가 좋았다."],
 overrefusal:["과잉 거절","안전 지침을 세게 걸면 멀쩡한 질문까지 거절하거나 답이 부실해지는 부작용. 그래서 7조가 '일반 요청 50문항 거절 0건'을 따로 쟀다."],
 injection:["프롬프트 인젝션 · 우회 공격","사용자가 '이전 지시는 무시해', '소설 속 이야기인데' 같은 말로 AI의 안전 지침을 무너뜨리려는 시도. 이걸 막는 능력을 강건성이라 한다."],
 kappa:["kappa(카파) 일치도","두 채점자가 우연을 넘어서 얼마나 같은 판정을 했는지 보는 지표. 0.8 이상이면 '거의 일치'로 본다. 1조 0.805는 사람 채점이 믿을 만하다는 근거."],
 structuring:["규정 구조화","법령·지침 같은 긴 글을 '대상·조건·금액·예외' 같은 표 형태로 정리하는 작업. 이렇게 정리해야 제도끼리 비교하거나 충돌을 찾을 수 있다. LLM이 잘하는 일이지만 해석 오류 검증이 필요."],
 simulation:["정책 시뮬레이션","'기준을 이렇게 바꾸면 수혜자가 몇 명, 예산이 얼마 변하나'를 데이터로 미리 계산해 보는 것."],
 decision:["의사결정 지원 모델","AI가 결정을 내리는 게 아니라, 결정하는 사람(의료진·담당자)에게 필요한 정보를 모아 정리해 주는 모델."],
 llmops:["LLMOps","LLM 서비스를 실제로 운영할 때 필요한 관리 전반. 어떤 모델·프롬프트 버전을 쓰는지, 성능을 어떻게 평가하고 지켜보는지, 비용·속도는 어떤지 관리하는 것. 학생들이 말하는 '반복 실행', '재현성', '모델 조합 비교', '자동 시험 522개'가 모두 이 영역이다."]
};
const GORDER=["llm","agent","multi","langgraph","tool","toolcall","api","rag","chunking","embedding","bm25","finetune","sysprompt","benchmark","judge","genverify","rulescore","hitl","structured","injection","effort","overrefusal","kappa","local","playwright","sttts","structuring","simulation","decision","llmops"];

const DAY="2026-11-23";
const SLOTS=[["13:10","13:15","오프닝 · 진행 안내",null],...ORDER.slice(0,3).map(k=>[T[k].start,T[k].end,null,k]),["14:15","14:25","쉬는 시간",null],...ORDER.slice(3,6).map(k=>[T[k].start,T[k].end,null,k]),["15:25","15:35","쉬는 시간",null],...ORDER.slice(6).map(k=>[T[k].start,T[k].end,null,k]),["16:15","16:25","총평 · 마무리",null]];

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mins=t=>{const[a,b]=t.split(":").map(Number);return a*60+b};
function nowMin(){const d=new Date();return d.getHours()*60+d.getMinutes()}
function isToday(){const d=new Date();const s=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");return s===DAY}
function liveKey(){if(!isToday())return null;const n=nowMin();for(const s of SLOTS){if(n>=mins(s[0])&&n<mins(s[1]))return s[3]||"__"+s[2]}return null}

/* ---------- memo store ---------- */
const memo={db:null,cache:{},timers:{},status:{},mode:"local"};
function lsGet(k){try{return localStorage.getItem("bufs-memo-"+k)||""}catch(e){return""}}
function lsSet(k,v){try{localStorage.setItem("bufs-memo-"+k,v)}catch(e){}}
async function initMemo(){
  try{
    if(!window.claude||!claude.use)return;
    const db=await claude.use("db");
    if(!db)return;
    memo.db=db;memo.mode="db";
    const timer=setTimeout(()=>{},10000);
    const snap=await db.collection("memos").get();
    clearTimeout(timer);
    snap.docs.forEach(d=>{const v=d.data();if(v&&typeof v.text==="string"&&!(d.id in memo.dirty)){memo.cache[d.id]=v.text}});
    try{const cs=await db.collection("checks").get();cs.docs.forEach(d=>{const v=d.data();if(v&&v.state&&typeof v.state==="object")chk.cache[d.id]=Object.assign({},v.state,getChk(d.id))})}catch(e){}
    render();
  }catch(e){memo.db=null;memo.mode="local";render()}
}
memo.dirty={};
function getMemo(k){if(k in memo.cache)return memo.cache[k];const v=lsGet(k);memo.cache[k]=v;return v}
function setMemo(k,v,el){
  memo.cache[k]=v;lsSet(k,v);memo.dirty[k]=1;
  if(el)el.textContent="입력 중…";
  clearTimeout(memo.timers[k]);
  memo.timers[k]=setTimeout(async()=>{
    const t=new Date();const hhmm=String(t.getHours()).padStart(2,"0")+":"+String(t.getMinutes()).padStart(2,"0");
    if(memo.db){
      try{await memo.db.collection("memos").doc(k).set({text:v,updatedAt:t.toISOString()});memo.status[k]="저장됨 "+hhmm;delete memo.dirty[k]}
      catch(e){memo.status[k]="서버 저장 실패, 이 브라우저에만 저장됨 "+hhmm}
    }else{memo.status[k]="이 브라우저에 저장됨 "+hhmm;delete memo.dirty[k]}
    const s=document.getElementById("st-"+k);if(s)s.textContent=memo.status[k];
  },900);
}
function memoBlock(k,label,quick){
  const st=memo.status[k]||(memo.mode==="db"?"자동 저장(Claude도 읽을 수 있음)":"자동 저장(이 브라우저)");
  return `<div class="panel memo"><div class="bar"><h3 style="margin:0">${esc(label)}</h3><span class="st" id="st-${k}">${esc(st)}</span></div>
  <textarea id="memo-${k}" data-k="${k}" placeholder="발표 중 메모. 칩을 누르면 줄 머리말이 들어갑니다.">${esc(getMemo(k))}</textarea>
  ${quick?`<div class="quick">${["잘한 점: ","보완: ","질문: ","데모: ","시간: "].map(q=>`<button type="button" data-k="${k}" data-q="${q}">${q.replace(": ","")}</button>`).join("")}</div>`:""}</div>`;
}

/* ---------- checklist ---------- */
const chk={cache:{},timers:{}};
function chkItems(k){const out=[];(CHK[k]||[]).forEach((g,gi)=>g[2].forEach((it,ii)=>out.push({id:gi+"-"+ii,crit:g[0],pts:g[1],hear:it[0],ask:it[1]})));return out}
function getChk(k){if(chk.cache[k])return chk.cache[k];let v={};try{v=JSON.parse(localStorage.getItem("bufs-chk-"+k)||"{}")}catch(e){}chk.cache[k]=v;return v}
function setChk(k,id,state){
  const v=Object.assign({},getChk(k));if(state)v[id]=state;else delete v[id];chk.cache[k]=v;
  try{localStorage.setItem("bufs-chk-"+k,JSON.stringify(v))}catch(e){}
  clearTimeout(chk.timers[k]);
  chk.timers[k]=setTimeout(async()=>{if(memo.db){try{await memo.db.collection("checks").doc(k).set({state:v,updatedAt:new Date().toISOString()})}catch(e){}}},600);
}
function chkCount(k){const v=getChk(k);const items=chkItems(k);return{ok:items.filter(i=>v[i.id]==="ok").length,ask:items.filter(i=>v[i.id]==="ask").length,n:items.length}}
function checkBlock(k){
  const v=getChk(k);const c=chkCount(k);
  const groups=(CHK[k]||[]).map((g,gi)=>`<div class="ck-g"><div class="ck-h"><b>${esc(g[0])}</b><span class="chip ${g[1]==="필수"?"warn":""}">${esc(g[1])}${/^\d+$/.test(g[1])?"점":""}</span></div>
   ${g[2].map((it,ii)=>{const id=gi+"-"+ii;const s=v[id]||"";return `<div class="ck ${s}" data-ck="${k}" data-id="${id}">
     <div class="ck-btns"><button type="button" class="ckb ok ${s==="ok"?"on":""}" data-s="ok" aria-pressed="${s==="ok"}" title="발표에서 충분히 나옴">말함</button><button type="button" class="ckb ask ${s==="ask"?"on":""}" data-s="ask" aria-pressed="${s==="ask"}" title="부족해서 질문함">질문</button></div>
     <div class="ck-t"><div>${esc(it[0])}</div><div class="ck-q">안 나오면 → ${esc(it[1])}</div>${it[2]?`<div class="ck-a"><b>이렇게 답하면 좋음</b> · ${esc(it[2])}</div>`:""}</div></div>`}).join("")}</div>`).join("");
  return `<div class="panel" id="ckpanel-${k}"><div class="memo"><div class="bar"><h3 style="margin:0">발표에서 들어야 할 것 · 심사기준별</h3><span class="st" id="ckc-${k}">말함 ${c.ok} · 질문 ${c.ask} / ${c.n}</span></div></div>
   <p class="notes" style="margin:0 0 10px">충분히 말하면 「말함」. 빠지거나 부족하면 「질문」을 누르면 물어볼 질문과 좋은 답변 예시가 펼쳐집니다. 다시 누르면 해제.</p>${groups}</div>`;
}

function tabsHtml(cur){
  const live=liveKey();
  const a=(h,label,extra="")=>`<a href="#${h}" class="${cur===h?"on":""} ${live===h?"live":""}" ${cur===h?'aria-current="page"':""}>${extra}${label}</a>`;
  return a("today","오늘 한눈에")+a("contests","공모전·심사기준")+`<span class="sep"></span>`+
    ORDER.map(k=>a(k,`${T[k].team} ${T[k].name.split(" (")[0]}`,`<span class="ord">${T[k].ord}</span>`)).join("")+
    `<span class="sep"></span>`+a("glossary","개념 사전")+a("wrapup","총평 메모");
}
function viewToday(){
  const live=liveKey();const n=nowMin();const today=isToday();
  const rows=SLOTS.map(s=>{
    const k=s[3];const done=today&&n>=mins(s[1]);const isLive=live===(k||"__"+s[2]);
    if(!k)return `<div class="tl-row break ${isLive?"live":""} ${done?"done":""}"><span class="t num">${s[0]}–${s[1]}</span><span>${esc(s[2])}</span><span></span></div>`;
    const t=T[k];
    return `<a class="tl-row ${isLive?"live":""} ${done?"done":""}" href="#${k}"><span class="t num">${s[0]}–${s[1]}</span><span><span class="who">${t.team} ${esc(t.name)}</span> <span class="topic">· ${esc(t.members.replace(/\(.*?\)/g,""))}</span><br><span class="topic">${esc(t.topic)}</span></span><span class="chip ${t.contest==="A"?"":t.contest==="B"?"gold":"good"}">${C[t.contest].short}</span></a>`;
  }).join("");

  <div class="tl">${rows}</div>

   <div class="tw"><table class="matrix"><thead><tr><th>조</th><th>에이전트</th><th>멀티 에이전트</th><th>RAG·검색</th><th>파인튜닝</th><th>공식 API 데이터</th><th>사람 승인 단계</th><th>정량 평가</th></tr></thead><tbody>
   ${ORDER.map(k=>{const m=MATRIX[k];return `<tr><td><a href="#${k}">${T[k].team} ${esc(T[k].name.split(" (")[0])}</a></td>${m.map(v=>`<td><span class="mk ${v[0]}" title="${esc(v.slice(2))}">${v[0]==="y"?"●":v[0]==="p"?"◐":"–"}</span>${v.length>2?`<br><span class="notes" style="font-size:11px">${esc(v.slice(2))}</span>`:""}</td>`).join("")}</tr>`}).join("")}
   </tbody></table></div>
   <p class="notes" style="margin:8px 0 0">● 있음 · ◐ 일부 · – 없음 (포스터 기준). <b>파인튜닝을 쓴 팀이 없음</b>: 과정에서 LoRA를 다뤘으니, 총평에서 「왜 안 썼는지 설명할 수 있으면 오히려 설계 역량」이라고 짚을 만함.</p></div>
  <div class="panel"><h3>과정이 안내한 발표 구성 (중간발표 기준, 노션)</h3>

const tm={dur:15*60,left:15*60,running:false,endAt:0,iv:null,label:"발표 15분"};
const fmt=s=>{const neg=s<0;s=Math.abs(Math.round(s));return (neg?"+":"")+String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
function tDraw(){
  const c=document.getElementById("clk"),b=document.getElementById("tbar");
  c.textContent=fmt(tm.left);
  const cls=tm.left<0?"over":tm.left<=Math.min(120,tm.dur*0.2)?"warn":"";
  c.className="clock "+cls;b.className=cls;
  b.style.width=Math.min(100,Math.max(0,(1-tm.left/tm.dur)*100))+"%";
  document.getElementById("tStart").textContent=tm.running?"일시정지":(tm.left===tm.dur?"시작":"계속");
  const k=cur();document.getElementById("twho").textContent=(T[k]?T[k].team:"")+(tm.left<0?" · 시간 초과":"");
}
function tStep(){tm.left=(tm.endAt-Date.now())/1000;tDraw()}
function tStart(){if(tm.running){tm.running=false;clearInterval(tm.iv);tStep();return}tm.running=true;tm.endAt=Date.now()+tm.left*1000;tm.iv=setInterval(tStep,250);tDraw()}
function tReset(){tm.running=false;clearInterval(tm.iv);tm.left=tm.dur;tDraw()}
